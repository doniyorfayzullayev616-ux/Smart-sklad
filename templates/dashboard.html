<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Smart-Sklad - Boshqaruv Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2, h3 { color: #1e293b; }

        /* Layout uchun panellar */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .panel { padding: 15px; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 30px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; }
        th { background-color: #1e293b; color: white; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #475569; font-weight: bold; font-size: 14px; }
        select, input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }

        button { padding: 10px 15px; background-color: #22c55e; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #16a34a; }
        .btn-add { background-color: #3b82f6; }
        .btn-add:hover { background-color: #2563eb; }
        .btn-delete { background-color: #ef4444; padding: 5px 10px; font-size: 12px; }
        .btn-delete:hover { background-color: #dc2626; }

        .logout-btn { background-color: #ef4444; float: right; }
        .success-msg { color: #16a34a; margin-top: 10px; font-weight: bold; font-size: 14px; }
        .search-box { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <button class="logout-btn" onclick="logout()">Chiqish</button>
        <h2>Smart-Sklad Paneli</h2>

        <div class="grid-container">
            <!-- Kassa Paneli -->
            <div class="panel">
                <h3>Kassa (Savdo qilish)</h3>
                <form id="saleForm">
                    <div class="form-group">
                        <label>Mahsulot ID</label>
                        <input type="number" id="productId" required>
                    </div>
                    <div class="form-group">
                        <label>Sotilish soni (Miqdor)</label>
                        <input type="number" id="quantity" value="1" min="1" required>
                    </div>
                    <button type="submit">Chek Urish (Sotish)</button>
                    <div id="saleMsg" class="success-msg"></div>
                </form>
            </div>

            <!-- Mahsulot Qo'shish Paneli -->
            <div class="panel">
                <h3>Yangi Mahsulot Qo'shish</h3>
                <form id="addProductForm">
                    <div class="form-group">
                        <label>Nomi</label>
                        <input type="text" id="newName" required>
                    </div>
                    <div class="form-group">
                        <label>Kategoriya (ID)</label>
                        <input type="number" id="newCategory" required>
                    </div>
                    <div class="form-group">
                        <label>Narxi</label>
                        <input type="number" step="0.01" id="newPrice" required>
                    </div>
                    <div class="form-group">
                        <label>Boshlang'ich qoldiq</label>
                        <input type="number" id="newStock" required>
                    </div>
                    <button type="submit" class="btn-add">Baza qo'shish</button>
                    <div id="addMsg" class="success-msg"></div>
                </form>
            </div>
        </div>

        <h3>Ombordagi mahsulotlar</h3>
        <input type="text" id="searchInput" class="search-box" placeholder="Mahsulot nomi bo'yicha qidirish">
        <a href="/api/export/excel/" style="display: inline-block; padding: 10px 15px;background-color: #10b981; color:white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 15px; float: right;">
            📥 Excel hisobot yuklab olish
        </a>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nomi</th>
                    <th>Kategoriya ID</th>
                    <th>Narxi</th>
                    <th>Qoldiq</th>
                    <th>Amal</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <!-- JavaScript orqali to'ldiriladi -->
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/api/login-ui/';
        }

        // 1. Mahsulotlarni o'qish (READ)
        // 1. loadProducts funksiyasini yangilang:
        async function loadProducts(searchQuery = '') {
            try {
                // Agar qidiruv so'zi bo'lsa manzilga ?search= qo'shamiz
                let url = '/api/products/';
                if (searchQuery) {
                    url += `?search=${searchQuery}`;
                }

                const response = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (response.ok) {
                    const data = await response.json();
                    const products = data.results || data;

                    const tbody = document.getElementById('productTableBody');
                    tbody.innerHTML = "";
                    products.forEach(p => {
                        tbody.innerHTML += `<tr>
                            <td>${p.id}</td>
                            <td>${p.name}</td>
                            <td>${p.category}</td>
                            <td>${p.price} so'm</td>
                            <td><b>${p.stock_quantity}</b></td>
                            <td>
                                <button class="btn-delete" onclick="deleteProduct(${p.id})">O'chirish</button>
                            </td>
                        </tr>`;
                    });
                }
            } catch (err) {
                console.error("Xatolik:", err);
            }
        }

        // 2. Qidiruv qutisida klaviatura bosilishini eshituvchi funksiya:
        document.getElementById('searchInput').addEventListener('input', function(e) {
            // Har safar harf yozilganda, API ga o'sha so'zni yuboramiz
            loadProducts(e.target.value);
        });

        loadProducts(); // Sahifa ochilganda barcha mahsulotlarni yuklash

        // 2. Savdo qilish
        document.getElementById('saleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('saleMsg');
            msgDiv.textContent = "";
            try {
                const response = await fetch('/api/sales/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({
                        items: [{
                            product: parseInt(document.getElementById('productId').value),
                            quantity: parseInt(document.getElementById('quantity').value)
                        }]
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    msgDiv.style.color = "#16a34a";
                    msgDiv.textContent = `Sotildi! Summa: ${data.total_amount} so'm`;
                    loadProducts();
                } else {
                    msgDiv.style.color = "#ef4444";
                    msgDiv.textContent = "Xatolik yuz berdi";
                }
            } catch (err) {
                msgDiv.textContent = "Server xatosi!";
            }
        });

        // 3. Yangi mahsulot qo'shish (CREATE)
        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('addMsg');

            const newProduct = {
                name: document.getElementById('newName').value,
                category: parseInt(document.getElementById('newCategory').value),
                price: document.getElementById('newPrice').value,
                stock_quantity: parseInt(document.getElementById('newStock').value)
            };

            try {
                const response = await fetch('/api/products/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(newProduct)
                });

                if (response.ok) {
                    msgDiv.style.color = "#16a34a";
                    msgDiv.textContent = "Mahsulot bazaga qo'shildi!";
                    document.getElementById('addProductForm').reset();
                    loadProducts(); // Jadvalni yangilash
                } else {
                    msgDiv.style.color = "#ef4444";
                    msgDiv.textContent = "Kategoriya ID xato yoki ma'lumot kam";
                }
            } catch (err) {
                msgDiv.textContent = "Server xatosi!";
            }
        });

        // 4. Mahsulotni o'chirish (DELETE)
        async function deleteProduct(id) {
            if(confirm("Rostdan ham bu mahsulotni o'chirmoqchimisiz?")) {
                try {
                    const response = await fetch(`/api/products/${id}/`, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });

                    if (response.ok || response.status === 204) {
                        alert("Mahsulot o'chirildi!");
                        loadProducts();
                    } else {
                        alert("O'chirishda xatolik yuz berdi.");
                    }
                } catch (err) {
                    alert("Server xatosi!");
                }
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/dashboard/';
        }
    </script>
</body>
</html>
